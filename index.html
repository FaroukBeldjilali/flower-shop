<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setting flowers</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        img {
            max-width: 100%;
            height: auto;
        }
        a {
            text-decoration: none;
            color: #936b;
            border-radius: 20px;
            background-color:#81e28e ;
            transition: .5s;
            padding: 5px 10px;
        }
        a:hover {
            background-color: rgb(116, 123, 129);
        }
        .header{
            background-color: #84c28c;
            padding: 15px 20px 40px 20px ;
            text-align: center;
        }
        .brand-name{
            color: #936b;
            font-size: 22px;
            margin-top: 1px;
        }

        .herfs{
            display: flex;
            justify-content: space-between;
            margin-top: 0;
            padding-top: 0;
        }
        .maim{
            display: flex;
            padding: 20px 20px;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .maim p{
            font-size: large;
        }
        .card{
            width: 300px;
            max-width: 100%;
            text-align: center;
            
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card p{
            margin: 0;
        }
        .btn {
            color: rgba(16, 17, 1, 0.733);
            border: 0;
            background-color: #da66d0;
            padding: 8px 16px;
            border-radius: 20px;
            justify-items: center;
            cursor: pointer;
            transition: .5s;
        }
        .btn:hover{
            background-color: #ac6b51;
        }
    </style>
</head>
<body>
    <div class="header">
        <nav class="herfs">
            <a class="home" href="">Home</a>
            <div class="lefts">
                <a href="">Shop</a>
                <a href="">About</a>
                <a href="">Contact</a>
            </div>

        </nav>
        <h1>Selling flowers</h1>
        <img src="images/download.png"
        width="100"
        alt="rose logo">
        <p class="brand-name">Flower Pallet</p>
    </div>
    <div class="maim">
        <div class="card card-1" >
            <img src="images/types-of-flowers-780x520.webp">
            <p>bacetta ward 50000dj</p>
            <button class="btn">Buy this here</button>
        </div>
        <div class="card card-2">
            <img src="images/cutflowermix-15.webp">
            <p>Beautifull bacette Roses 8500dj</p>
            <button class="btn">Buy this here</button>
        </div>
    </div>
</body>
</html>
